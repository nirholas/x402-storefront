<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="x402 Storefront — pay per item in USDC on Base or Solana">
  <rect width="1200" height="630" fill="#0b0c10"/>
  <rect x="0" y="0" width="1200" height="6" fill="#0052ff"/>
  <g transform="translate(96 150)">
